name: Capture README web UI screenshots

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/capture-readme-screenshots.yml'
      - 'scripts/capture-readme-screenshots.cjs'
      - 'portal/src/main/resources/static/start.html'
      - 'portal/src/main/resources/static/portal.html'
      - 'portal/src/main/resources/static/workbench-flow.css'
      - 'portal/src/main/resources/static/calculator-center.html'
      - 'portal/src/main/resources/static/calculator-center.css'
      - 'portal/src/main/resources/static/calculator-center.js'
      - 'portal/src/main/resources/static/calculator-topics.js'
      - 'scripts/verify-calculator-visual.cjs'
      - 'portal/src/main/resources/static/burial-depth.html'
      - 'portal/src/main/resources/static/burial-depth-math.js'
      - 'portal/src/main/resources/static/burial-depth.js'
      - 'scripts/verify-burial-depth-visual.cjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install screenshot browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture checked-in web UI at desktop viewport
        shell: bash
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory portal/src/main/resources/static >/tmp/workbench-screenshot-server.log 2>&1 &
          for i in {1..15}; do
            if curl -fsS http://127.0.0.1:8765/start.html >/dev/null; then break; fi
            sleep 1
          done
          node scripts/capture-readme-screenshots.cjs
          node scripts/verify-calculator-visual.cjs
          node scripts/verify-burial-depth-visual.cjs
      - name: Commit original UI screenshots
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/*.png
          if git diff --cached --quiet; then
            echo "Screenshots already up to date."
          else
            git commit -m "docs: capture current Electrical Workbench web UI screenshots"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Electrical Calculators moved to Find a Tool</title>
<script>
/* Preserve old bookmarks without maintaining a second, competing tool finder. */
(function(){
  'use strict';
  var old=new URLSearchParams(window.location.search);
  var next=new URLSearchParams();
  next.set('category','calculations');
  if(old.has('q'))next.set('q',old.get('q'));
  if(old.has('topic'))next.set('topic',old.get('topic'));
  window.location.replace('/start.html?'+next.toString()+window.location.hash);
})();
</script>
</head><body>
<p>Electrical calculators are now inside <a href="/start.html?category=calculations">Find a Tool → CEC Calculators</a>.</p>
</body></html>
